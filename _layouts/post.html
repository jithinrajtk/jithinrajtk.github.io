---
layout: default
---
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{ page.title | escape }}",
  "description": "{{ page.description | default: page.excerpt | strip_html | escape }}",
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
  "author": {
    "@type": "Person",
    "name": "Jithin Raaj",
    "url": "https://jithinraaj.in",
    "jobTitle": "Social Media Team Lead",
    "sameAs": [
      "https://linkedin.com/in/jithinrajtk",
      "https://github.com/jithinrajtk"
    ]
  },
  "publisher": {
    "@type": "Person",
    "name": "Jithin Raaj",
    "url": "https://jithinraaj.in"
  },
  "url": "{{ page.url | absolute_url }}",
  "mainEntityOfPage": "{{ page.url | absolute_url }}",
  "wordCount": {{ content | number_of_words }}
}
</script>

<article class="post">
  <header class="post-header">
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      {% if page.tags %}
        <span class="post-tags">
          {% for tag in page.tags %}
            <span class="tag">{{ tag }}</span>
          {% endfor %}
        </span>
      {% endif %}
    </div>
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.subtitle %}
    <p class="post-subtitle">{{ page.subtitle }}</p>
    {% endif %}
  </header>

  <div class="post-content prose">
    {{ content }}
  </div>

  <footer class="post-footer">
    <a href="/writing/" class="back-link">← All writing</a>
  </footer>
</article>
