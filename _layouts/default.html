<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary Meta Tags -->
  <title>{% if page.title and page.title != 'Jithin Raaj' %}{{ page.title }} — Jithin Raaj{% else %}Jithin Raaj - Social Media Team Lead & Automation Expert{% endif %}</title>
  <meta name="title" content="Jithin Raaj - Social Media Team Lead & Automation Expert" />
  <meta name="description" content="Social Media Team Lead at Entri | Expert in Problem Solving, Marketing, Social Media, Coding, Automation & AI | Helping startups scale their social media presence" />
  <meta name="keywords" content="Jithin Raaj, Social Media Lead, Automation Expert, AI Solutions, Social Media Marketing, Problem Solving, Team Lead, Entri" />
  <meta name="author" content="Jithin Raaj" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://jithinraaj.in/" />
  <meta property="og:title" content="Jithin Raaj - Social Media Team Lead & Automation Expert" />
  <meta property="og:description" content="Social Media Team Lead at Entri | Expert in Problem Solving, Marketing, Social Media, Coding, Automation & AI | Helping startups scale their social media presence" />
  <meta property="og:image" content="https://jithinraaj.in/assets/images/profile.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://jithinraaj.in/" />
  <meta property="twitter:title" content="Jithin Raaj - Social Media Team Lead & Automation Expert" />
  <meta property="twitter:description" content="Social Media Team Lead at Entri | Expert in Problem Solving, Marketing, Social Media, Coding, Automation & AI | Helping startups scale their social media presence" />
  <meta property="twitter:image" content="https://jithinraaj.in/assets/images/profile.png" />

  <!-- Canonical -->
  <link rel="canonical" href="https://jithinraaj.in/" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/images/profile.png" />
  <link rel="apple-touch-icon" href="/assets/images/profile.png" />

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Jithin Raaj",
    "url": "https://jithinraaj.in",
    "image": "https://jithinraaj.in/assets/images/profile.png",
    "jobTitle": "Social Media Team Lead",
    "worksFor": {
      "@type": "Organization",
      "name": "Entri"
    },
    "description": "Social Media Team Lead at Entri | Expert in Problem Solving, Marketing, Social Media, Coding, Automation & AI",
    "knowsAbout": ["Social Media Marketing", "Automation", "AI", "Problem Solving", "Coding"],
    "sameAs": [
      "https://www.linkedin.com/in/jithinrajtk/",
      "https://github.com/jithinrajtk"
    ]
  }
  </script>

  {% feed_meta %}
</head>
<body>
  {% include header.html %}
  <main class="container">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</body>
</html>
