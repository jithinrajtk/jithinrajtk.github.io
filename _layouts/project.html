---
layout: default
---
<article class="post">
  <header class="post-header">
    <div class="post-meta">
      <span>Project</span>
      {% if page.status %}
        <span class="tag tag--{{ page.status }}">{{ page.status }}</span>
      {% endif %}
    </div>
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.description %}
    <p class="post-subtitle">{{ page.description }}</p>
    {% endif %}
  </header>

  <div class="post-content prose">
    {{ content }}
  </div>

  <footer class="post-footer">
    <a href="/#projects" class="back-link">← All projects</a>
  </footer>
</article>
