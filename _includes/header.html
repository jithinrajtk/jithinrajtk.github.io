<header class="site-header">
  <div class="container header-inner">
    <div class="header-identity">
      <a href="/" class="header-identity-link">
        <img src="/assets/images/profile.png" alt="Jithin Raaj" class="profile-photo" />
        <div>
          <span class="site-name">Jithin Raaj</span>
          <span class="site-tagline">Building things to solve problems.</span>
        </div>
      </a>
    </div>
    <nav class="site-nav">
      <a href="/" {% if page.url == '/' %}class="active"{% endif %}>About</a>
      <a href="/writing/" {% if page.url contains '/writing' or page.layout == 'post' %}class="active"{% endif %}>Writing</a>
      <a href="/projects/" {% if page.url contains '/projects' %}class="active"{% endif %}>Projects</a>
      <a href="/contact/" {% if page.url == '/contact/' %}class="active"{% endif %}>Contact</a>
    </nav>
  </div>
  <div class="header-divider"></div>
</header>
